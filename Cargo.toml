[package]
name = "tandem-rng"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Tandem8x32: a noncryptographic pseudorandom number generator, fast on CPUs and GPUs alike"
license = "Apache-2.0"
repository = "https://github.com/tandem-rng/tandem-rs"
documentation = "https://docs.rs/tandem-rng"
keywords = ["random", "rng", "prng", "splittable", "counter-based"]
categories = ["algorithms", "no-std"]
include = ["src/**", "README.md", "LICENSE", "NOTICE"]

[dependencies]
bytemuck = { version = "1", default-features = false }
libm = "0.2"
pollster = { version = "1", optional = true }
rand_core = "0.10"
rayon = { version = "1", optional = true }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }
wide = { version = "1.7", default-features = false }

[profile.bench]
debug = false

[profile.release]
codegen-units = 1

[dev-dependencies]
serde_json = "1"

[features]
# Parallel fills over rows. Pulls in std.
rayon = ["dep:rayon"]
# Serialize and Deserialize for `Tandem` through its transport form.
serde = ["dep:serde"]
# NEON and SSE2 intrinsics for the widening multiply and the float row stores. Admits
# `unsafe` in one module. The stream is the same.
simd-intrinsics = []
# GPU fills through wgpu. Pulls in std.
wgpu = ["dep:wgpu", "dep:pollster"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "bench_gpu"
required-features = ["wgpu"]

[[example]]
name = "bench_par"
required-features = ["rayon"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.rust }} ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.89"]
        features: ["", simd-intrinsics, serde, rayon, rand, "simd-intrinsics,rayon"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features "${{ matrix.features }}" -- -D warnings
      - run: cargo test --features "${{ matrix.features }}"
      - run: cargo test --release --features "${{ matrix.features }}"
  sse2:
    name: SSE2 path on an AVX2 runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: grep -q avx2 /proc/cpuinfo
      - run: cargo test --features simd-intrinsics
        env:
          TANDEM_NO_AVX2: "1"
  no-std:
    name: no default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features alloc,rand
  gpu:
    name: ${{ matrix.os }} / wgpu
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Software Vulkan adapter
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --features wgpu
  shader:
    name: shader is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone --depth 1 https://github.com/tandem-rng/tandem-webgpu ../tandem-webgpu
          diff ../tandem-webgpu/tandem.wgsl src/tandem.wgsl
  scalar:
    name: scalar fallback (riscv64, qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - run: cross test --target riscv64gc-unknown-linux-gnu
      - run: cross test --target riscv64gc-unknown-linux-gnu --features simd-intrinsics
  vectors:
    name: vector data is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          git clone --depth 1 https://github.com/tandem-rng/spec ../tandem-spec
          python3 tools/gen_vectors.py ../tandem-spec/vectors.json > tests/vectors_data/mod.rs
          rustfmt --edition 2024 tests/vectors_data/mod.rs
          git diff --exit-code tests/vectors_data/mod.rs
  zig-tables:
    name: ziggurat tables are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          git clone --depth 1 https://github.com/tandem-rng/spec ../tandem-spec
          python3 tools/gen_zig_tables.py ../tandem-spec/tables/normal_f64_zig1024.json > src/zig_tables.rs
          rustfmt --edition 2024 src/zig_tables.rs
          git diff --exit-code src/zig_tables.rs
  conformance:
    name: conformance files are the spec's
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone -q https://github.com/tandem-rng/spec ../tandem-spec
          git -C ../tandem-spec checkout -q b31af7238076b414a3eb2a128bfd010cce136287
          for f in below fill_below normal exponential choice hashes; do
            cmp tests/conformance/$f.json ../tandem-spec/conformance/$f.json
          done
